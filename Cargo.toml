[package]
name = "slack_tui"
version = "0.1.0"
description = "An example generated using the hello-world template"
authors = ["Heri Setiawan <heri.setiawan@dkatalis.com>"]
license = "MIT"
edition = "2024"

[dependencies]
axum = "0.8.8"
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
color-eyre = "0.6.3"
crossterm = "0.29.0"
dirs = "6.0.0"
opener = "0.8.4"
ratatui = "0.30.0"
rcgen = "0.14.7"
reqwest = { version = "0.13.2", features = ["form", "json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.51.0", features = ["full"] }
toml = "1.1.2"

# Read the optimization guideline for more details: https://ratatui.rs/recipes/apps/release-your-app/#optimizations
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
