[package]
name = "slack_tui"
version = "0.1.0"
description = "An example generated using the hello-world template"
authors = ["Heri Setiawan <heri.setiawan@dkatalis.com>"]
license = "MIT"
edition = "2024"

[dependencies]
color-eyre = "0.6.3"
crossterm = "0.29.0"
dirs = "6.0.0"
opener = "0.8.4"
ratatui = "0.30.0"
reqwest = "0.13.2"
serde = { version = "1.0.228", features = ["derive"] }
tiny_http = "0.12.0"
toml = "1.1.2"

# Read the optimization guideline for more details: https://ratatui.rs/recipes/apps/release-your-app/#optimizations
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
